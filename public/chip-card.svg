  <line x1="56" y1="404" x2="800" y2="404" stroke="#d9e0de" stroke-width="1"/>
  <text x="56" y="444" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#4b5b58">Every batch's laboratory report hash is published there,</text>
  <text x="56" y="472" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#4b5b58">written to a public chain, and readable by anyone.</text>
  <text x="56" y="512" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#4b5b58">Ask for this card with your order.</text>
