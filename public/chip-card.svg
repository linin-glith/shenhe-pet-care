  <text x="56" y="126" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#4b5b58">Private-label pet care manufacturing · Heyuan, Guangdong</text>
  <text x="56" y="216" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#12211f">Touch this card with a phone</text>
